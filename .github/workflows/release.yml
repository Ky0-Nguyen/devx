name: Release

# Every push to main -- a merged change -- becomes a release:
#
#   1. Decide the version. A version in CMakeLists.txt that has no tag yet is
#      released as it is (someone set it by hand). Otherwise it is bumped:
#      patch by default, minor or major when any commit message since the last
#      release says [minor] or [major] (or BREAKING CHANGE).
#   2. Build and run every test suite.
#   3. Build DevX-<version>.dmg with tools/release.sh: Developer ID signed and
#      notarized when the secrets below exist, ad-hoc otherwise.
#   4. Commit "Release <version>" (the version, and the Homebrew cask when the
#      image is notarized) on top of what was built, tag it <version>, and
#      keep a branch v<version> at the same commit as a backup of exactly what
#      shipped. Only the tag and that branch are pushed: main is never pushed
#      to, because main takes changes through reviewed pull requests only.
#   5. Publish the GitHub release with the image attached. An ad-hoc build is
#      published as a pre-release, and the cask is left alone, so nobody
#      installing through Homebrew is handed an image Gatekeeper refuses.
#   6. Open a pull request that brings the release commit to main. Homebrew
#      reads the cask from main, so `brew upgrade` offers the new version once
#      that pull request is merged. Its title says [skip release], which ends
#      up in the merge commit whichever way it is merged, so merging it does
#      not release again.
#
# Opening that pull request needs Settings > Actions > General > "Allow GitHub
# Actions to create and approve pull requests". Without it the release is
# still complete, and the run prints a link to open the pull request by hand.
#
# Not released: a push whose head commit says [skip release], and a push that
# only touches docs, Markdown, the cask or the landing page (site/).
#
# Notarization secrets:
#   DEVELOPER_ID_P12_BASE64   the "Developer ID Application" certificate and
#                             its key, exported as .p12, base64
#   DEVELOPER_ID_P12_PASSWORD the .p12's export password
#   DEVELOPER_ID_NAME         "Developer ID Application: Name (TEAMID)"
#   NOTARY_APPLE_ID, NOTARY_PASSWORD (an app-specific password), NOTARY_TEAM_ID
#     -- or NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID, NOTARY_ISSUER for an API key
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "Casks/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      level:
        description: "patch, minor, major, or an exact x.y.z (empty: decide from commit messages)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

# One release at a time, and never cancelled halfway: a cancelled run could
# leave a tag without its release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_P8: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Decide the version
        id: version
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          current=$(bash tools/bump-version.sh --current)
          last=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          # Until the last release's pull request is merged, main's version is
          # behind its tag; continue from whichever is higher.
          highest=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -n "$highest" ] && [ "$(printf '%s\n%s\n' "$current" "$highest" | sort -V | tail -1)" = "$highest" ] \
             && [ "$current" != "$highest" ]; then
            bash tools/bump-version.sh "$highest" >/dev/null
            current=$highest
          fi
          if ! git rev-parse -q --verify "refs/tags/$current" >/dev/null; then
            next=$current
            why="CMakeLists.txt already says $current, which has no tag"
          else
            level=$LEVEL
            if [ -z "$level" ]; then
              messages=$(git log --format=%B ${last:+$last..HEAD})
              if grep -qiE '\[major\]|BREAKING CHANGE' <<<"$messages"; then level=major
              elif grep -qi '\[minor\]' <<<"$messages"; then level=minor
              else level=patch; fi
            fi
            next=$(bash tools/bump-version.sh "$level")
            why="$level bump from $current"
          fi
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::$next is already tagged"; exit 1
          fi
          echo "releasing $next ($why; previous release ${last:-none})"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          xcrun simctl list devices > /dev/null  # start CoreSimulatorService before the probe-timing tests
          (cd build && ctest --output-on-failure)
          ./build/bin/devx_swift_tests
          bash tools/smoke-test.sh

      - name: Import the Developer ID certificate
        if: env.P12 != ''
        run: |
          kc=$RUNNER_TEMP/release.keychain-db
          security create-keychain -p "" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "DEVX_SIGN_IDENTITY=${{ secrets.DEVELOPER_ID_NAME }}" >> "$GITHUB_ENV"

      - name: Notary credentials (Apple ID)
        if: env.P12 != '' && env.NOTARY_APPLE_ID != ''
        run: |
          {
            echo "DEVX_NOTARY_APPLE_ID=${{ secrets.NOTARY_APPLE_ID }}"
            echo "DEVX_NOTARY_PASSWORD=${{ secrets.NOTARY_PASSWORD }}"
            echo "DEVX_NOTARY_TEAM_ID=${{ secrets.NOTARY_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      - name: Notary credentials (API key)
        if: env.P12 != '' && env.NOTARY_APPLE_ID == '' && env.NOTARY_P8 != ''
        run: |
          echo "$NOTARY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          {
            echo "DEVX_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "DEVX_NOTARY_KEY_ID=${{ secrets.NOTARY_KEY_ID }}"
            echo "DEVX_NOTARY_ISSUER=${{ secrets.NOTARY_ISSUER }}"
          } >> "$GITHUB_ENV"

      - name: Disk image
        id: dmg
        run: |
          bash tools/release.sh | tee "$RUNNER_TEMP/release.out"
          grep -E '^(dmg|sha256)=' "$RUNNER_TEMP/release.out" >> "$GITHUB_OUTPUT"
          if [ -n "${DEVX_SIGN_IDENTITY:-}" ]; then
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, tag, and keep a backup branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.dmg.outputs.sha256 }}
          NOTARIZED: ${{ steps.dmg.outputs.notarized }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          if [ "$NOTARIZED" = true ]; then
            bash tools/bump-cask.sh "$VERSION" "$SHA" notarized
            git add Casks/devx.rb
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Release $VERSION [skip release]"
          fi
          git tag -a "$VERSION" -m "DevX $VERSION"
          git branch "v$VERSION"
          # Both or neither: a tag without its backup branch is a half-made
          # release.
          git push --atomic origin "refs/tags/$VERSION" "refs/heads/v$VERSION"

      - name: Publish the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.dmg.outputs.dmg }}
          NOTARIZED: ${{ steps.dmg.outputs.notarized }}
        run: |
          if [ "$NOTARIZED" = true ]; then
            note="Signed with a Developer ID and notarized by Apple."
            extra=()
          else
            note="**Signed ad-hoc, not notarized** (the signing secrets are not set): on first launch, right-click DevX and choose Open. Published as a pre-release, and the Homebrew cask still points at the last notarized release."
            extra=(--prerelease)
          fi
          gh release create "$VERSION" "$DMG" "$DMG.sha256" \
            --title "DevX $VERSION" --verify-tag --generate-notes \
            --notes "$note Backup branch: \`v$VERSION\`. sha256 of the image: \`$(cut -d' ' -f1 "$DMG.sha256")\`." \
            "${extra[@]}"

      - name: Open the pull request that brings the release to main
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTARIZED: ${{ steps.dmg.outputs.notarized }}
        run: |
          if git diff --quiet "origin/main" "v$VERSION" -- CMakeLists.txt Casks/devx.rb; then
            echo "main already has this release's version and cask; no pull request needed"
            exit 0
          fi
          # Its own branch, so that deleting it after the merge leaves the
          # v<version> backup alone.
          branch="release-to-main/$VERSION"
          git push origin "v$VERSION:refs/heads/$branch"
          if [ "$NOTARIZED" = true ]; then
            what="the version and the Homebrew cask"
            brew="Once merged, \`brew update && brew upgrade --cask devx\` installs $VERSION."
          else
            what="the version"
            brew="The image is not notarized, so the Homebrew cask stays on the last notarized release."
          fi
          body="DevX $VERSION is released: https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION

          This brings $what to main. $brew

          The title says [skip release], so merging this does not release again."
          if ! gh pr create --base main --head "$branch" \
               --title "Release $VERSION: $what [skip release]" \
               --body "$body"; then
            echo "::warning::Could not open the pull request (allow it in Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'). Open it by hand: https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          fi
