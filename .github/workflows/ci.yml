name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      # The first simctl call on a fresh runner starts CoreSimulatorService,
      # which takes longer than the probe budget test_ios_identity holds
      # discovery to. Start it here so the test measures a warm probe, as it
      # would be on a developer's Mac.
      - name: Start CoreSimulatorService
        run: xcrun simctl list devices > /dev/null

      - name: C++ tests
        run: cd build && ctest --output-on-failure

      - name: Swift tests
        run: ./build/bin/devx_swift_tests

      - name: Smoke test
        run: bash tools/smoke-test.sh
